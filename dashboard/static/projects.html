<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects — Abacus</title>
    <link rel="stylesheet" href="/static/styles.css">
    <style>
        /* Projects-specific styles */
        .projects-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .status-tabs {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
            padding: 0.25rem;
            background: var(--white);
            border-radius: 8px;
            box-shadow: var(--shadow);
        }

        .status-tab {
            flex: 1;
            padding: 0.75rem 1rem;
            border: none;
            background: transparent;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--gray-text);
            transition: all 0.2s;
        }

        .status-tab.active {
            background: var(--navy);
            color: var(--white);
        }

        .status-tab:hover:not(.active) {
            background: var(--gray-bg);
        }

        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.5rem;
        }

        .project-card {
            background: var(--white);
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: var(--shadow);
            cursor: pointer;
            transition: all 0.2s;
            border-left: 4px solid;
        }

        .project-card:hover {
            box-shadow: var(--shadow-hover);
            transform: translateY(-2px);
        }

        .project-card-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 1rem;
        }

        .project-name {
            font-size: 1.125rem;
            font-weight: 600;
            color: var(--navy);
            margin-bottom: 0.25rem;
        }

        .project-description {
            font-size: 0.875rem;
            color: var(--gray-text);
            margin-bottom: 1rem;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .project-dates {
            font-size: 0.75rem;
            color: var(--gray-text);
            margin-bottom: 0.75rem;
        }

        .project-stats {
            display: flex;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .project-stat {
            display: flex;
            flex-direction: column;
        }

        .project-stat-label {
            font-size: 0.75rem;
            color: var(--gray-text);
            margin-bottom: 0.25rem;
        }

        .project-stat-value {
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--navy);
        }

        .project-budget-bar {
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid var(--gray-border);
        }

        .budget-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: var(--gray-text);
            margin-bottom: 0.5rem;
        }

        .budget-progress {
            height: 6px;
            background: var(--gray-bg);
            border-radius: 3px;
            overflow: hidden;
        }

        .budget-progress-bar {
            height: 100%;
            background: var(--blue);
            border-radius: 3px;
            transition: width 0.3s;
        }

        .budget-progress-bar.over-budget {
            background: var(--coral);
        }

        /* Modal styles */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--white);
            border-radius: 12px;
            padding: 2rem;
            max-width: 500px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .modal-title {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--navy);
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--gray-text);
            padding: 0;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
        }

        .modal-close:hover {
            background: var(--gray-bg);
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-group label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--navy);
            margin-bottom: 0.5rem;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--gray-border);
            border-radius: 6px;
            font-size: 0.875rem;
            font-family: inherit;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .color-picker-wrapper {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .color-picker-wrapper input[type="color"] {
            width: 50px;
            height: 40px;
            border: 1px solid var(--gray-border);
            border-radius: 6px;
            cursor: pointer;
        }

        .modal-actions {
            display: flex;
            gap: 0.75rem;
            justify-content: flex-end;
            margin-top: 1.5rem;
        }

        /* Project detail view */
        .project-detail {
            display: none;
        }

        .project-detail.active {
            display: block;
        }

        .detail-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 2rem;
            padding-bottom: 1.5rem;
            border-bottom: 2px solid var(--gray-border);
        }

        .detail-back {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--blue);
            cursor: pointer;
            font-size: 0.875rem;
            margin-bottom: 1rem;
        }

        .detail-back:hover {
            text-decoration: underline;
        }

        .detail-title-section {
            flex: 1;
        }

        .detail-title {
            font-size: 2rem;
            font-weight: 700;
            color: var(--navy);
            margin-bottom: 0.5rem;
        }

        .detail-actions {
            display: flex;
            gap: 0.75rem;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: var(--white);
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: var(--shadow);
        }

        .stat-card-label {
            font-size: 0.875rem;
            color: var(--gray-text);
            margin-bottom: 0.5rem;
        }

        .stat-card-value {
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--navy);
        }

        .detail-section {
            background: var(--white);
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: var(--shadow);
            margin-bottom: 1.5rem;
        }

        .section-title {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--navy);
            margin-bottom: 1rem;
        }

        .transaction-search {
            display: flex;
            gap: 0.75rem;
            margin-bottom: 1rem;
        }

        .transaction-search input {
            flex: 1;
            padding: 0.75rem;
            border: 1px solid var(--gray-border);
            border-radius: 6px;
            font-size: 0.875rem;
        }

        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            color: var(--gray-text);
        }

        .empty-state-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        .category-breakdown-grid {
            display: grid;
            gap: 0.75rem;
        }

        .category-breakdown-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.75rem;
            background: var(--gray-bg);
            border-radius: 6px;
        }

        .category-breakdown-label {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .category-group-name {
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--navy);
        }

        .category-name {
            font-size: 0.75rem;
            color: var(--gray-text);
        }

        .category-breakdown-amount {
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--coral);
            font-family: 'SF Mono', 'Monaco', monospace;
        }
    </style>
</head>
<body data-page="Projects">
    <div class="main-content">
        <!-- List View -->
        <div id="projects-list">
            <div class="projects-header">
                <div>
                    <h2>Projects</h2>
                    <p>Track and manage your financial projects</p>
                </div>
                <button class="btn-primary" onclick="openNewProjectModal()">+ New Project</button>
            </div>

            <div class="status-tabs">
                <button class="status-tab active" data-status="active" onclick="filterByStatus('active')">Active</button>
                <button class="status-tab" data-status="complete" onclick="filterByStatus('complete')">Complete</button>
                <button class="status-tab" data-status="archived" onclick="filterByStatus('archived')">Archived</button>
                <button class="status-tab" data-status="" onclick="filterByStatus('')">All</button>
            </div>

            <div class="projects-grid" id="projects-grid">
                <div class="loading" style="grid-column: 1 / -1; text-align: center; padding: 3rem;">
                    Loading projects...
                </div>
            </div>
        </div>

        <!-- Detail View -->
        <div id="project-detail" class="project-detail"></div>
    </div>

    <!-- New Project Modal -->
    <div id="new-project-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title">New Project</h3>
                <button class="modal-close" onclick="closeNewProjectModal()">×</button>
            </div>
            <form id="new-project-form" onsubmit="createProject(event)">
                <div class="form-group">
                    <label for="project-name">Project Name *</label>
                    <input type="text" id="project-name" required>
                </div>
                <div class="form-group">
                    <label for="project-description">Description</label>
                    <textarea id="project-description"></textarea>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="project-start-date">Start Date</label>
                        <input type="date" id="project-start-date">
                    </div>
                    <div class="form-group">
                        <label for="project-end-date">End Date</label>
                        <input type="date" id="project-end-date">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="project-budget">Budget</label>
                        <input type="number" id="project-budget" step="0.01" min="0" placeholder="0.00">
                    </div>
                    <div class="form-group">
                        <label for="project-color">Color</label>
                        <div class="color-picker-wrapper">
                            <input type="color" id="project-color" value="#3B82F6">
                            <span id="color-preview">#3B82F6</span>
                        </div>
                    </div>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn-secondary" onclick="closeNewProjectModal()">Cancel</button>
                    <button type="submit" class="btn-primary">Create Project</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Add Transactions Modal -->
    <div id="add-transactions-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title">Add Transactions</h3>
                <button class="modal-close" onclick="closeAddTransactionsModal()">×</button>
            </div>
            <div class="transaction-search">
                <input type="search" id="transaction-search" placeholder="Search transactions...">
                <button class="btn-primary" onclick="searchTransactions()">Search</button>
            </div>
            <div id="transaction-search-results" style="max-height: 400px; overflow-y: auto;">
                <p style="text-align: center; color: var(--gray-text); padding: 2rem;">
                    Search for transactions to add to this project
                </p>
            </div>
            <div class="modal-actions">
                <button type="button" class="btn-secondary" onclick="closeAddTransactionsModal()">Close</button>
            </div>
        </div>
    </div>

    <script src="/static/components/sidebar.js"></script>
    <script>
        let currentFilter = 'active';
        let currentProject = null;

        // Color picker preview
        document.addEventListener('DOMContentLoaded', () => {
            const colorPicker = document.getElementById('project-color');
            const colorPreview = document.getElementById('color-preview');
            if (colorPicker && colorPreview) {
                colorPicker.addEventListener('input', (e) => {
                    colorPreview.textContent = e.target.value;
                });
            }
            loadProjects('active');
        });

        function filterByStatus(status) {
            currentFilter = status;
            document.querySelectorAll('.status-tab').forEach(tab => {
                tab.classList.toggle('active', tab.dataset.status === status);
            });
            loadProjects(status);
        }

        async function loadProjects(status = '') {
            try {
                const url = status ? `/api/projects?status=${status}` : '/api/projects';
                const response = await fetch(url);
                const data = await response.json();
                
                const grid = document.getElementById('projects-grid');
                grid.innerHTML = '';

                if (data.projects.length === 0) {
                    grid.innerHTML = `
                        <div class="empty-state" style="grid-column: 1 / -1;">
                            <div class="empty-state-icon">📁</div>
                            <h3>No projects found</h3>
                            <p>Create your first project to get started</p>
                        </div>
                    `;
                    return;
                }

                data.projects.forEach(project => {
                    const card = createProjectCard(project);
                    grid.appendChild(card);
                });
            } catch (error) {
                console.error('Error loading projects:', error);
                const grid = document.getElementById('projects-grid');
                grid.innerHTML = '<p style="grid-column: 1 / -1; text-align: center; color: var(--coral);">Error loading projects</p>';
            }
        }

        function createProjectCard(project) {
            const card = document.createElement('div');
            card.className = 'project-card';
            card.style.borderLeftColor = project.color || '#3B82F6';
            card.onclick = () => viewProject(project.id);

            const dateRange = formatDateRange(project.start_date, project.end_date);
            const budgetSection = project.budget_amount ? createBudgetSection(project.total_spent, project.budget_amount) : '';

            card.innerHTML = `
                <div class="project-card-header">
                    <div class="project-name">${escapeHtml(project.name)}</div>
                </div>
                ${project.description ? `<div class="project-description">${escapeHtml(project.description)}</div>` : ''}
                ${dateRange ? `<div class="project-dates">${dateRange}</div>` : ''}
                <div class="project-stats">
                    <div class="project-stat">
                        <div class="project-stat-label">Transactions</div>
                        <div class="project-stat-value">${project.transaction_count}</div>
                    </div>
                    <div class="project-stat">
                        <div class="project-stat-label">Total Spent</div>
                        <div class="project-stat-value">$${project.total_spent.toFixed(2)}</div>
                    </div>
                </div>
                ${budgetSection}
            `;

            return card;
        }

        function createBudgetSection(spent, budget) {
            const percentage = (spent / budget) * 100;
            const isOverBudget = percentage > 100;
            
            return `
                <div class="project-budget-bar">
                    <div class="budget-label">
                        <span>Budget</span>
                        <span>$${spent.toFixed(2)} / $${budget.toFixed(2)}</span>
                    </div>
                    <div class="budget-progress">
                        <div class="budget-progress-bar ${isOverBudget ? 'over-budget' : ''}" 
                             style="width: ${Math.min(percentage, 100)}%"></div>
                    </div>
                </div>
            `;
        }

        function formatDateRange(startDate, endDate) {
            if (!startDate && !endDate) return '';
            if (startDate && endDate) return `${formatDate(startDate)} — ${formatDate(endDate)}`;
            if (startDate) return `From ${formatDate(startDate)}`;
            if (endDate) return `Until ${formatDate(endDate)}`;
            return '';
        }

        function formatDate(dateStr) {
            // Parse as local date (not UTC) to avoid timezone offset issues
            const [year, month, day] = dateStr.split('-').map(Number);
            const date = new Date(year, month - 1, day);
            return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
        }

        async function viewProject(projectId) {
            try {
                const response = await fetch(`/api/projects/${projectId}`);
                const project = await response.json();
                currentProject = project;

                const detailView = document.getElementById('project-detail');
                const listView = document.getElementById('projects-list');

                detailView.innerHTML = `
                    <div class="detail-back" onclick="backToList()">← Back to Projects</div>
                    <div class="detail-header">
                        <div class="detail-title-section">
                            <div class="detail-title" style="border-left: 4px solid ${project.color}; padding-left: 1rem;">
                                ${escapeHtml(project.name)}
                            </div>
                            ${project.description ? `<p style="color: var(--gray-text); margin-left: 1.25rem;">${escapeHtml(project.description)}</p>` : ''}
                        </div>
                        <div class="detail-actions">
                            ${project.status === 'active' ? '<button class="btn-secondary" onclick="completeProject()">Mark Complete</button>' : ''}
                            ${project.status === 'complete' ? '<button class="btn-secondary" onclick="archiveProject()">Archive</button>' : ''}
                            <button class="btn-secondary" onclick="deleteProject()">Delete</button>
                        </div>
                    </div>

                    <div class="stats-grid">
                        <div class="stat-card">
                            <div class="stat-card-label">Total Spent</div>
                            <div class="stat-card-value">$${project.total_spent.toFixed(2)}</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-card-label">Transactions</div>
                            <div class="stat-card-value">${project.transaction_count}</div>
                        </div>
                        ${project.budget_amount ? `
                        <div class="stat-card">
                            <div class="stat-card-label">Budget</div>
                            <div class="stat-card-value">$${project.budget_amount.toFixed(2)}</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-card-label">Remaining</div>
                            <div class="stat-card-value" style="color: ${project.budget_amount - project.total_spent >= 0 ? 'var(--green)' : 'var(--coral)'}">
                                $${(project.budget_amount - project.total_spent).toFixed(2)}
                            </div>
                        </div>
                        ` : ''}
                    </div>

                    ${project.category_breakdown.length > 0 ? `
                    <div class="detail-section">
                        <h3 class="section-title">Category Breakdown</h3>
                        <div class="category-breakdown-grid">
                            ${project.category_breakdown.map(cat => `
                                <div class="category-breakdown-item">
                                    <div class="category-breakdown-label">
                                        <div class="category-group-name">${escapeHtml(cat.category_group)}</div>
                                        <div class="category-name">${escapeHtml(cat.category)}</div>
                                    </div>
                                    <div class="category-breakdown-amount">$${cat.total.toFixed(2)}</div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                    ` : ''}

                    <div class="detail-section">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                            <h3 class="section-title" style="margin: 0;">Transactions</h3>
                            <button class="btn-primary" onclick="openAddTransactionsModal()">+ Add Transactions</button>
                        </div>
                        ${project.transactions.length > 0 ? `
                        <div class="table-wrapper">
                            <table>
                                <thead>
                                    <tr>
                                        <th>Date</th>
                                        <th>Description</th>
                                        <th>Category</th>
                                        <th>Amount</th>
                                        <th></th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${project.transactions.map(txn => `
                                        <tr>
                                            <td>${formatDate(txn.transaction_date)}</td>
                                            <td>${escapeHtml(txn.description)}</td>
                                            <td>${escapeHtml(txn.category)}</td>
                                            <td style="font-family: 'SF Mono', monospace; font-weight: 600; color: var(--coral);">
                                                $${Math.abs(txn.amount).toFixed(2)}
                                            </td>
                                            <td>
                                                <button class="btn-secondary" style="padding: 0.25rem 0.5rem; font-size: 0.75rem;" 
                                                        onclick="removeTransaction('${txn.id}')">Remove</button>
                                            </td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                        ` : '<p style="text-align: center; color: var(--gray-text); padding: 2rem;">No transactions linked yet</p>'}
                    </div>
                `;

                listView.classList.remove('active');
                listView.style.display = 'none';
                detailView.classList.add('active');
            } catch (error) {
                console.error('Error loading project:', error);
                alert('Error loading project details');
            }
        }

        function backToList() {
            document.getElementById('project-detail').classList.remove('active');
            document.getElementById('projects-list').style.display = 'block';
            currentProject = null;
            loadProjects(currentFilter);
        }

        function openNewProjectModal() {
            document.getElementById('new-project-modal').classList.add('active');
        }

        function closeNewProjectModal() {
            document.getElementById('new-project-modal').classList.remove('active');
            document.getElementById('new-project-form').reset();
        }

        async function createProject(event) {
            event.preventDefault();
            
            const data = {
                name: document.getElementById('project-name').value,
                description: document.getElementById('project-description').value || null,
                start_date: document.getElementById('project-start-date').value || null,
                end_date: document.getElementById('project-end-date').value || null,
                budget_amount: document.getElementById('project-budget').value || null,
                color: document.getElementById('project-color').value
            };

            try {
                const response = await fetch('/api/projects', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                const result = await response.json();
                if (result.success) {
                    closeNewProjectModal();
                    loadProjects(currentFilter);
                } else {
                    alert('Error creating project: ' + (result.error || 'Unknown error'));
                }
            } catch (error) {
                console.error('Error creating project:', error);
                alert('Error creating project');
            }
        }

        async function completeProject() {
            if (!currentProject) return;
            
            if (!confirm('Mark this project as complete?')) return;

            try {
                const response = await fetch(`/api/projects/${currentProject.id}/status`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status: 'complete' })
                });

                const result = await response.json();
                if (result.success) {
                    backToList();
                } else {
                    alert('Error updating project status');
                }
            } catch (error) {
                console.error('Error updating project status:', error);
                alert('Error updating project status');
            }
        }

        async function archiveProject() {
            if (!currentProject) return;
            
            if (!confirm('Archive this project?')) return;

            try {
                const response = await fetch(`/api/projects/${currentProject.id}/status`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status: 'archived' })
                });

                const result = await response.json();
                if (result.success) {
                    backToList();
                } else {
                    alert('Error archiving project');
                }
            } catch (error) {
                console.error('Error archiving project:', error);
                alert('Error archiving project');
            }
        }

        async function deleteProject() {
            if (!currentProject) return;
            
            if (!confirm(`Delete project "${currentProject.name}"? This will remove all transaction links but keep the transactions themselves.`)) return;

            try {
                const response = await fetch(`/api/projects/${currentProject.id}`, {
                    method: 'DELETE'
                });

                const result = await response.json();
                if (result.success) {
                    backToList();
                } else {
                    alert('Error deleting project');
                }
            } catch (error) {
                console.error('Error deleting project:', error);
                alert('Error deleting project');
            }
        }

        function openAddTransactionsModal() {
            document.getElementById('add-transactions-modal').classList.add('active');
        }

        function closeAddTransactionsModal() {
            document.getElementById('add-transactions-modal').classList.remove('active');
            document.getElementById('transaction-search').value = '';
            document.getElementById('transaction-search-results').innerHTML = '<p style="text-align: center; color: var(--gray-text); padding: 2rem;">Search for transactions to add to this project</p>';
        }

        async function searchTransactions() {
            const query = document.getElementById('transaction-search').value;
            if (!query) return;

            try {
                const response = await fetch(`/api/transactions?search=${encodeURIComponent(query)}&per_page=20`);
                const data = await response.json();

                const resultsDiv = document.getElementById('transaction-search-results');
                
                if (data.transactions.length === 0) {
                    resultsDiv.innerHTML = '<p style="text-align: center; color: var(--gray-text); padding: 2rem;">No transactions found</p>';
                    return;
                }

                // Filter out already linked transactions
                const linkedIds = new Set(currentProject.transactions.map(t => t.id));
                const availableTransactions = data.transactions.filter(t => !linkedIds.has(t.id));

                if (availableTransactions.length === 0) {
                    resultsDiv.innerHTML = '<p style="text-align: center; color: var(--gray-text); padding: 2rem;">All matching transactions are already linked</p>';
                    return;
                }

                resultsDiv.innerHTML = `
                    <div style="display: grid; gap: 0.5rem;">
                        ${availableTransactions.map(txn => `
                            <div style="display: flex; justify-content: space-between; align-items: center; padding: 0.75rem; background: var(--gray-bg); border-radius: 6px;">
                                <div style="flex: 1;">
                                    <div style="font-weight: 500;">${escapeHtml(txn.description)}</div>
                                    <div style="font-size: 0.75rem; color: var(--gray-text);">
                                        ${formatDate(txn.transaction_date)} • ${escapeHtml(txn.category)}
                                    </div>
                                </div>
                                <div style="display: flex; align-items: center; gap: 1rem;">
                                    <div style="font-family: 'SF Mono', monospace; font-weight: 600; color: var(--coral);">
                                        $${Math.abs(txn.amount).toFixed(2)}
                                    </div>
                                    <button class="btn-primary" style="padding: 0.5rem 0.75rem; font-size: 0.75rem;" 
                                            onclick="addTransaction('${txn.id}')">Add</button>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;
            } catch (error) {
                console.error('Error searching transactions:', error);
                document.getElementById('transaction-search-results').innerHTML = '<p style="text-align: center; color: var(--coral); padding: 2rem;">Error searching transactions</p>';
            }
        }

        async function addTransaction(transactionId) {
            if (!currentProject) return;

            try {
                const response = await fetch(`/api/projects/${currentProject.id}/transactions`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ transaction_ids: [transactionId] })
                });

                const result = await response.json();
                if (result.success) {
                    closeAddTransactionsModal();
                    viewProject(currentProject.id); // Reload project detail
                } else {
                    alert('Error adding transaction');
                }
            } catch (error) {
                console.error('Error adding transaction:', error);
                alert('Error adding transaction');
            }
        }

        async function removeTransaction(transactionId) {
            if (!currentProject) return;
            
            if (!confirm('Remove this transaction from the project?')) return;

            try {
                const response = await fetch(`/api/projects/${currentProject.id}/transactions/${transactionId}`, {
                    method: 'DELETE'
                });

                const result = await response.json();
                if (result.success) {
                    viewProject(currentProject.id); // Reload project detail
                } else {
                    alert('Error removing transaction');
                }
            } catch (error) {
                console.error('Error removing transaction:', error);
                alert('Error removing transaction');
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
