<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reports — Abacus</title>
    <link rel="stylesheet" href="/static/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
</head>
<body data-page="Reports">
    <div class="main-content">
        <div class="page-header">
            <h2>Reports</h2>
            <p>Spending trends and insights</p>
        </div>

        <!-- Spending Trends Over Time -->
        <div class="card" style="margin-bottom: 1.5rem;">
            <div id="trends-chart" class="chart-container large"></div>
        </div>

        <!-- Charts Row -->
        <div class="grid grid-2">
            <div class="card">
                <div id="month-comparison-chart" class="chart-container"></div>
            </div>
            <div class="card">
                <div id="top-merchants-chart" class="chart-container"></div>
            </div>
        </div>

        <!-- Category Breakdown Table -->
        <div class="card" style="margin-top: 1.5rem;">
            <h3 class="card-title">Category Breakdown (Current Month)</h3>
            <div class="table-wrapper">
                <table id="category-breakdown">
                    <thead>
                        <tr>
                            <th>Category Group</th>
                            <th>Category</th>
                            <th>Amount</th>
                            <th>% of Total</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr><td colspan="4" class="loading">Loading...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="/static/components/sidebar.js"></script>
    <script src="/static/components/charts.js"></script>
    <script>
        // Load spending trends
        fetch('/api/reports/trends?months=6')
            .then(r => r.json())
            .then(data => {
                const trends = data.trends;
                const months = Object.keys(trends).reverse();
                
                // Get all unique categories
                const categoriesSet = new Set();
                Object.values(trends).forEach(monthData => {
                    Object.keys(monthData).forEach(cat => categoriesSet.add(cat));
                });
                const categories = Array.from(categoriesSet);
                
                // Build series data
                const series = categories.map(category => ({
                    name: category,
                    data: months.map(month => trends[month][category] || 0)
                }));
                
                const monthLabels = months.map(m => {
                    const date = new Date(m);
                    return date.toLocaleDateString('en-US', { month: 'short', year: '2-digit' });
                });
                
                createStackedAreaChart('trends-chart', monthLabels, series, 'Spending by Category Over Time');
            });

        // Load cashflow for month comparison
        fetch('/api/cashflow?months=6')
            .then(r => r.json())
            .then(data => {
                const reversed = data.cashflow.reverse();
                const months = reversed.map(m => {
                    const date = new Date(m.month);
                    return date.toLocaleDateString('en-US', { month: 'short' });
                });
                
                const series = [
                    {
                        name: 'Income',
                        data: reversed.map(m => m.income)
                    },
                    {
                        name: 'Expenses',
                        data: reversed.map(m => m.expenses)
                    }
                ];
                
                createLineChart('month-comparison-chart', months, series, 'Month-over-Month Comparison');
            });

        // Load top merchants
        fetch('/api/merchants/top?limit=10')
            .then(r => r.json())
            .then(data => {
                const merchants = data.merchants.map(m => m.merchant);
                const amounts = data.merchants.map(m => m.total);
                
                createHorizontalBarChart('top-merchants-chart', merchants, amounts, 'Top 10 Merchants');
            });

        // Load category breakdown
        fetch('/api/categories/spending')
            .then(r => r.json())
            .then(data => {
                const tbody = document.querySelector('#category-breakdown tbody');
                tbody.innerHTML = '';
                
                const total = data.categories.reduce((sum, cat) => sum + cat.amount, 0);
                
                data.categories.forEach(cat => {
                    const row = document.createElement('tr');
                    const percentage = total > 0 ? ((cat.amount / total) * 100).toFixed(1) : 0;
                    row.innerHTML = `
                        <td>${cat.category_group}</td>
                        <td>${cat.category}</td>
                        <td class="amount negative">$${cat.amount.toFixed(2)}</td>
                        <td>${percentage}%</td>
                    `;
                    tbody.appendChild(row);
                });
                
                // Add total row
                const totalRow = document.createElement('tr');
                totalRow.style.fontWeight = '600';
                totalRow.style.borderTop = '2px solid var(--gray-border)';
                totalRow.innerHTML = `
                    <td colspan="2">TOTAL</td>
                    <td class="amount negative">$${total.toFixed(2)}</td>
                    <td>100%</td>
                `;
                tbody.appendChild(totalRow);
            });
    </script>
</body>
</html>
