<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Review Transactions — Abacus</title>
    <link rel="stylesheet" href="/static/styles.css">
    <style>
        /* Review-specific styles */
        .review-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .pending-badge {
            display: inline-block;
            background: var(--coral);
            color: white;
            padding: 0.25rem 0.75rem;
            border-radius: 12px;
            font-size: 0.875rem;
            font-weight: 600;
            margin-left: 0.75rem;
        }

        .progress-bar-container {
            background: #E0E0E0;
            border-radius: 8px;
            height: 8px;
            margin-bottom: 1.5rem;
            overflow: hidden;
        }

        .progress-bar-fill {
            background: var(--green);
            height: 100%;
            transition: width 0.5s ease-out;
        }

        .progress-text {
            font-size: 0.875rem;
            color: var(--gray-text);
            margin-bottom: 0.5rem;
        }

        .filter-bar {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            align-items: center;
        }

        .filter-bar select,
        .filter-bar input {
            padding: 0.75rem 1rem;
            border: 1px solid var(--gray-border);
            border-radius: 8px;
            font-size: 0.875rem;
            background: var(--white);
        }

        .transaction-card {
            background: var(--white);
            border: 1px solid var(--gray-border);
            border-radius: 12px;
            padding: 1rem;
            margin-bottom: 0.75rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            transition: all 0.3s ease-out;
            opacity: 1;
            transform: translateY(0);
        }

        .transaction-card.removing {
            opacity: 0;
            transform: translateY(-20px);
            margin-bottom: 0;
            padding-top: 0;
            padding-bottom: 0;
            max-height: 0;
            overflow: hidden;
        }

        .transaction-card.transferring {
            opacity: 0;
            transform: translateX(100px);
        }

        .transaction-card:hover {
            box-shadow: var(--shadow-hover);
        }

        .transaction-checkbox {
            width: 20px;
            height: 20px;
            cursor: pointer;
            flex-shrink: 0;
        }

        .transaction-main {
            flex: 1;
            min-width: 0;
        }

        .transaction-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
        }

        .transaction-merchant {
            font-weight: 600;
            font-size: 1rem;
            color: var(--navy);
        }

        .transaction-amount {
            font-weight: 700;
            font-size: 1.125rem;
            color: var(--coral);
            font-family: 'SF Mono', 'Monaco', monospace;
            flex-shrink: 0;
        }

        .transaction-details {
            font-size: 0.875rem;
            color: var(--gray-text);
            margin-bottom: 0.75rem;
        }

        .transaction-actions {
            display: flex;
            gap: 0.5rem;
            align-items: center;
            flex-wrap: wrap;
        }

        .category-pill {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.375rem 0.75rem;
            border-radius: 8px;
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.2s;
        }

        .category-pill:hover {
            border-color: var(--coral);
        }

        .transfer-hint {
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
            font-size: 0.75rem;
            color: var(--gray-text);
            padding: 0.25rem 0.5rem;
            border-radius: 6px;
            background: #FFF3E0;
        }

        .btn-mark-transfer {
            padding: 0.5rem 1rem;
            border: 1px solid var(--gray-border);
            border-radius: 8px;
            background: var(--white);
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-mark-transfer:hover {
            background: var(--gray-bg);
            border-color: var(--coral);
        }

        .confirm-bar {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            background: var(--coral);
            color: white;
            padding: 1rem 2rem;
            border-radius: 12px;
            box-shadow: var(--shadow-hover);
            display: none;
            align-items: center;
            gap: 1rem;
            z-index: 100;
        }

        .confirm-bar.active {
            display: flex;
        }

        .btn-confirm {
            background: white;
            color: var(--coral);
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-confirm:hover {
            background: #F5F5F7;
        }

        /* Category Picker Modal */
        .category-picker-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .category-picker-overlay.active {
            display: flex;
        }

        .category-picker {
            background: var(--white);
            border-radius: 12px;
            box-shadow: var(--shadow-hover);
            max-width: 500px;
            width: 90%;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
        }

        .category-picker-header {
            padding: 1.5rem;
            border-bottom: 1px solid var(--gray-border);
        }

        .category-search {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid var(--gray-border);
            border-radius: 8px;
            font-size: 0.875rem;
        }

        .category-picker-body {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
        }

        .category-section {
            margin-bottom: 1.5rem;
        }

        .category-section-title {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--gray-text);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 0.75rem;
        }

        .category-group-header {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem;
            cursor: pointer;
            border-radius: 8px;
            transition: background 0.2s;
            user-select: none;
        }

        .category-group-header:hover {
            background: var(--gray-bg);
        }

        .category-group-icon {
            font-size: 1.25rem;
        }

        .category-group-name {
            flex: 1;
            font-weight: 600;
            color: var(--navy);
        }

        .category-group-toggle {
            font-size: 0.875rem;
            color: var(--gray-text);
        }

        .category-list {
            padding-left: 2.5rem;
            display: none;
        }

        .category-list.expanded {
            display: block;
        }

        .category-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.2s;
        }

        .category-item:hover {
            background: var(--gray-bg);
        }

        .category-icon {
            font-size: 1.125rem;
        }

        .category-name {
            flex: 1;
            font-size: 0.875rem;
            color: var(--navy);
        }

        .category-color-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .recent-categories {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 0.5rem;
            margin-bottom: 0.5rem;
        }

        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
        }

        .empty-state-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
        }

        .empty-state-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--navy);
            margin-bottom: 0.5rem;
        }

        .empty-state-text {
            color: var(--gray-text);
        }

        /* Toast notifications */
        .toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: var(--navy);
            color: white;
            padding: 1rem 1.5rem;
            border-radius: 12px;
            box-shadow: var(--shadow-hover);
            display: none;
            align-items: center;
            gap: 1rem;
            z-index: 200;
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.2s ease-out;
        }

        .toast.active {
            display: flex;
            transform: translateY(0);
            opacity: 1;
        }

        .toast-action {
            background: white;
            color: var(--navy);
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.875rem;
        }

        .loading {
            text-align: center;
            padding: 3rem;
            color: var(--gray-text);
        }
    </style>
</head>
<body data-page="Review">
    <div class="main-content">
        <div class="review-header">
            <div>
                <h2>📋 Review Transactions<span class="pending-badge" id="pending-count">0</span></h2>
                <p>Confirm categories and mark transfers</p>
            </div>
        </div>

        <!-- Progress Bar -->
        <div>
            <div class="progress-text" id="progress-text">0 reviewed • 0 remaining</div>
            <div class="progress-bar-container">
                <div class="progress-bar-fill" id="progress-bar" style="width: 0%"></div>
            </div>
        </div>

        <!-- Filter Bar -->
        <div class="filter-bar">
            <select id="sort-select">
                <option value="amount">Largest first</option>
                <option value="date">Newest first</option>
                <option value="date_asc">Oldest first</option>
            </select>
            <select id="account-filter">
                <option value="">All accounts</option>
            </select>
        </div>

        <!-- Transaction List -->
        <div id="transaction-list">
            <div class="loading">Loading transactions...</div>
        </div>

        <!-- Empty State -->
        <div id="empty-state" class="empty-state" style="display: none;">
            <div class="empty-state-icon">🎉</div>
            <div class="empty-state-title">All caught up!</div>
            <div class="empty-state-text">No transactions to review.</div>
        </div>
    </div>

    <!-- Confirm Bar (appears when items are checked) -->
    <div class="confirm-bar" id="confirm-bar">
        <span id="selected-count">0 selected</span>
        <button class="btn-confirm" id="confirm-btn">✅ Confirm Selected</button>
    </div>

    <!-- Category Picker Modal -->
    <div class="category-picker-overlay" id="category-picker-overlay">
        <div class="category-picker">
            <div class="category-picker-header">
                <input type="text" class="category-search" id="category-search" placeholder="🔍 Search categories...">
            </div>
            <div class="category-picker-body" id="category-picker-body">
                <div class="loading">Loading categories...</div>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast">
        <span id="toast-message"></span>
        <button class="toast-action" id="toast-action">Undo</button>
    </div>

    <script src="/static/components/sidebar.js"></script>
    <script src="/static/components/table.js"></script>
    <script>
        // State
        let transactions = [];
        let categories = [];
        let selectedIds = new Set();
        let currentTransactionId = null;
        let stats = { pending: 0, confirmed: 0, corrected: 0, transfers: 0 };
        let lastAction = null; // For undo functionality

        // Load data
        async function loadTransactions() {
            try {
                const sortBy = document.getElementById('sort-select').value;
                const accountId = document.getElementById('account-filter').value;
                
                const params = new URLSearchParams({ sort_by: sortBy });
                if (accountId) params.append('account_id', accountId);
                
                const res = await fetch(`/api/review?${params}`);
                const data = await res.json();
                
                transactions = data.transactions;
                stats = data.stats;
                
                renderTransactions();
                updateStats();
            } catch (err) {
                console.error('Failed to load transactions:', err);
            }
        }

        async function loadCategories() {
            try {
                const res = await fetch('/api/categories/all');
                const data = await res.json();
                categories = data.groups;
            } catch (err) {
                console.error('Failed to load categories:', err);
            }
        }

        function renderTransactions() {
            const container = document.getElementById('transaction-list');
            const emptyState = document.getElementById('empty-state');
            
            if (transactions.length === 0) {
                container.style.display = 'none';
                emptyState.style.display = 'block';
                return;
            }
            
            container.style.display = 'block';
            emptyState.style.display = 'none';
            
            container.innerHTML = transactions.map(txn => {
                const isLikelyTransfer = /PAYMENT|PYMT|XFER|TRANSFER|AUTOPAY|APPLECARD|GSBANK|CHASE/.test(txn.description.toUpperCase());
                const merchant = txn.merchant || txn.description;
                const category = txn.category || 'Uncategorized';
                const categoryGroup = txn.category_group || '';
                
                return `
                    <div class="transaction-card" data-id="${txn.id}">
                        <input type="checkbox" class="transaction-checkbox" data-id="${txn.id}">
                        <div class="transaction-main">
                            <div class="transaction-header">
                                <div class="transaction-merchant">${merchant}</div>
                                <div class="transaction-amount">$${Math.abs(txn.amount).toFixed(2)}</div>
                            </div>
                            <div class="transaction-details">
                                ${formatDate(txn.transaction_date)} • ${txn.account_id || 'Unknown account'}
                            </div>
                            <div class="transaction-actions">
                                <div class="category-pill" data-id="${txn.id}" style="background: ${getCategoryColor(categoryGroup)}20; color: ${getCategoryColor(categoryGroup)};">
                                    <span>${getCategoryIcon(category)}</span>
                                    <span>${category}</span>
                                </div>
                                ${isLikelyTransfer ? '<span class="transfer-hint">🔄 Likely transfer</span>' : ''}
                                <button class="btn-mark-transfer" data-id="${txn.id}">Mark Transfer</button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
            
            // Attach event listeners
            document.querySelectorAll('.transaction-checkbox').forEach(cb => {
                cb.addEventListener('change', handleCheckboxChange);
            });
            
            document.querySelectorAll('.category-pill').forEach(pill => {
                pill.addEventListener('click', (e) => {
                    const txnId = e.currentTarget.dataset.id;
                    openCategoryPicker(txnId);
                });
            });
            
            document.querySelectorAll('.btn-mark-transfer').forEach(btn => {
                btn.addEventListener('click', async (e) => {
                    const txnId = e.currentTarget.dataset.id;
                    await markAsTransfer(txnId);
                });
            });
        }

        function getCategoryColor(group) {
            const colorMap = {
                'Food & Drink': '#FF6B6B',
                'Housing': '#4ECDC4',
                'Transportation': '#95E1D3',
                'Shopping': '#F38181',
                'Health': '#AA96DA',
                'Entertainment': '#FCBAD3',
                'Bills & Subscriptions': '#FFD93D',
                'Travel': '#6BCF7F',
                'Pets': '#C7CEEA',
                'Personal': '#FFEAA7',
                'Income': '#81C784',
            };
            return colorMap[group] || '#6B7280';
        }

        function getCategoryIcon(category) {
            // Default icon mapping (simplified)
            const iconMap = {
                'Groceries': '🛒', 'Dining Out': '🍴', 'Coffee & Drinks': '☕',
                'Gas': '⛽', 'Utilities': '⚡', 'Rent/Mortgage': '🏘️',
            };
            return iconMap[category] || '📦';
        }

        function handleCheckboxChange(e) {
            const id = e.target.dataset.id;
            if (e.target.checked) {
                selectedIds.add(id);
            } else {
                selectedIds.delete(id);
            }
            updateConfirmBar();
        }

        function updateConfirmBar() {
            const bar = document.getElementById('confirm-bar');
            const count = document.getElementById('selected-count');
            
            if (selectedIds.size > 0) {
                bar.classList.add('active');
                count.textContent = `${selectedIds.size} selected`;
            } else {
                bar.classList.remove('active');
            }
        }

        async function confirmSelected() {
            if (selectedIds.size === 0) return;
            
            try {
                const res = await fetch('/api/transactions/batch-review', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ transaction_ids: Array.from(selectedIds) })
                });
                
                if (res.ok) {
                    // Animate out and remove
                    selectedIds.forEach(id => {
                        const card = document.querySelector(`[data-id="${id}"]`);
                        if (card && card.classList.contains('transaction-card')) {
                            card.classList.add('removing');
                            setTimeout(() => card.remove(), 300);
                        }
                    });
                    
                    // Update state
                    transactions = transactions.filter(t => !selectedIds.has(t.id));
                    selectedIds.clear();
                    updateConfirmBar();
                    
                    // Reload after animation
                    setTimeout(() => {
                        loadTransactions();
                    }, 350);
                    
                    showToast('Confirmed!', null);
                }
            } catch (err) {
                console.error('Failed to confirm:', err);
            }
        }

        async function markAsTransfer(txnId) {
            try {
                const res = await fetch(`/api/transactions/${txnId}/transfer`, {
                    method: 'POST'
                });
                
                if (res.ok) {
                    const data = await res.json();
                    
                    // Animate out
                    const card = document.querySelector(`.transaction-card[data-id="${txnId}"]`);
                    if (card) {
                        card.classList.add('transferring');
                        setTimeout(() => {
                            card.remove();
                            transactions = transactions.filter(t => t.id !== txnId);
                            loadTransactions();
                        }, 300);
                    }
                    
                    const message = data.paired ? 'Marked as transfer and paired!' : 'Marked as transfer';
                    showToast(message, () => {
                        // TODO: Implement undo
                    });
                }
            } catch (err) {
                console.error('Failed to mark transfer:', err);
            }
        }

        function openCategoryPicker(txnId) {
            currentTransactionId = txnId;
            const overlay = document.getElementById('category-picker-overlay');
            overlay.classList.add('active');
            
            renderCategoryPicker();
            
            // Auto-focus search
            setTimeout(() => {
                document.getElementById('category-search').focus();
            }, 100);
        }

        function renderCategoryPicker(filter = '') {
            const body = document.getElementById('category-picker-body');
            const filterLower = filter.toLowerCase();
            
            body.innerHTML = `
                <div class="category-section">
                    <div class="category-section-title">All Categories</div>
                    ${categories.map(group => {
                        const matchingCats = group.categories.filter(cat => 
                            !cat.hidden && cat.name.toLowerCase().includes(filterLower)
                        );
                        
                        if (matchingCats.length === 0 && filterLower) return '';
                        
                        return `
                            <div>
                                <div class="category-group-header" data-group="${group.id}">
                                    <span class="category-group-icon">${group.icon}</span>
                                    <span class="category-group-name">${group.name}</span>
                                    <span class="category-group-toggle">▸</span>
                                </div>
                                <div class="category-list" data-group="${group.id}">
                                    ${matchingCats.map(cat => `
                                        <div class="category-item" data-category-id="${cat.id}">
                                            <span class="category-icon">${cat.icon}</span>
                                            <span class="category-name">${cat.name}</span>
                                            <div class="category-color-dot" style="background: ${cat.color};"></div>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        `;
                    }).join('')}
                </div>
            `;
            
            // Attach event listeners
            document.querySelectorAll('.category-group-header').forEach(header => {
                header.addEventListener('click', () => {
                    const groupId = header.dataset.group;
                    const list = document.querySelector(`.category-list[data-group="${groupId}"]`);
                    const toggle = header.querySelector('.category-group-toggle');
                    
                    list.classList.toggle('expanded');
                    toggle.textContent = list.classList.contains('expanded') ? '▾' : '▸';
                });
            });
            
            document.querySelectorAll('.category-item').forEach(item => {
                item.addEventListener('click', async () => {
                    const categoryId = item.dataset.categoryId;
                    await selectCategory(categoryId);
                });
            });
        }

        async function selectCategory(categoryId) {
            try {
                const res = await fetch(`/api/transactions/${currentTransactionId}/correct`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ category_id: categoryId, apply_to_similar: false })
                });
                
                if (res.ok) {
                    const data = await res.json();
                    
                    // Close picker
                    document.getElementById('category-picker-overlay').classList.remove('active');
                    
                    // Animate out transaction
                    const card = document.querySelector(`.transaction-card[data-id="${currentTransactionId}"]`);
                    if (card) {
                        card.classList.add('removing');
                        setTimeout(() => {
                            card.remove();
                            transactions = transactions.filter(t => t.id !== currentTransactionId);
                            loadTransactions();
                        }, 300);
                    }
                    
                    // Show toast with "Apply to similar" option if applicable
                    if (data.updated_count > 1) {
                        showToast(`Updated ${data.updated_count} transactions!`, null);
                    } else {
                        showToast('Category updated!', null);
                    }
                }
            } catch (err) {
                console.error('Failed to update category:', err);
            }
        }

        function showToast(message, onUndo) {
            const toast = document.getElementById('toast');
            const messageEl = document.getElementById('toast-message');
            const actionBtn = document.getElementById('toast-action');
            
            messageEl.textContent = message;
            
            if (onUndo) {
                actionBtn.style.display = 'block';
                actionBtn.onclick = onUndo;
            } else {
                actionBtn.style.display = 'none';
            }
            
            toast.classList.add('active');
            
            setTimeout(() => {
                toast.classList.remove('active');
            }, 5000);
        }

        function updateStats() {
            document.getElementById('pending-count').textContent = stats.pending;
            
            const total = stats.pending + stats.confirmed + stats.corrected;
            const reviewed = stats.confirmed + stats.corrected;
            const percent = total > 0 ? (reviewed / total * 100) : 100;
            
            document.getElementById('progress-bar').style.width = `${percent}%`;
            document.getElementById('progress-text').textContent = `${reviewed} reviewed • ${stats.pending} remaining`;
        }

        // Event listeners
        document.getElementById('confirm-btn').addEventListener('click', confirmSelected);
        
        document.getElementById('sort-select').addEventListener('change', loadTransactions);
        
        document.getElementById('category-search').addEventListener('input', (e) => {
            renderCategoryPicker(e.target.value);
        });
        
        // Close picker on overlay click
        document.getElementById('category-picker-overlay').addEventListener('click', (e) => {
            if (e.target === e.currentTarget) {
                e.currentTarget.classList.remove('active');
            }
        });
        
        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                document.getElementById('category-picker-overlay').classList.remove('active');
            }
        });

        // Initialize
        loadCategories();
        loadTransactions();
    </script>
</body>
</html>
